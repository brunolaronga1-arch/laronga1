<!-- PLACEHOLDER — substituir por foto real (detalhe de arquitetura com luz quente, formato retrato 3:4) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9DDCB"/><stop offset="1" stop-color="#D6C4A8"/>
    </linearGradient>
    <linearGradient id="niche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF3DC"/><stop offset="0.6" stop-color="#F0DDBB"/><stop offset="1" stop-color="#DCC6A2"/>
    </linearGradient>
    <filter id="b"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="600" height="800" fill="url(#w)"/>
  <!-- degraus de escada com balizadores -->
  <g fill="#CDB896">
    <rect x="0" y="560" width="600" height="40"/>
    <rect x="0" y="620" width="600" height="40"/>
    <rect x="0" y="680" width="600" height="40"/>
    <rect x="0" y="740" width="600" height="60"/>
  </g>
  <g fill="#FFF1D4" opacity="0.8" filter="url(#b)">
    <rect x="0" y="596" width="600" height="14"/>
    <rect x="0" y="656" width="600" height="14"/>
    <rect x="0" y="716" width="600" height="14"/>
  </g>
  <!-- nicho iluminado -->
  <rect x="200" y="120" width="220" height="340" fill="#C7B190"/>
  <rect x="212" y="132" width="196" height="316" fill="url(#niche)"/>
  <ellipse cx="310" cy="150" rx="110" ry="60" fill="#FFF8EA" opacity="0.8" filter="url(#b)"/>
  <rect x="280" y="360" width="56" height="88" rx="26" fill="#BFA785"/>
  <rect x="236" y="404" width="34" height="44" rx="14" fill="#D3BE9C"/>
</svg>
