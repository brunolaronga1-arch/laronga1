<!-- PLACEHOLDER — substituir por foto real (arquitetura, luz quente e natural, formato retrato 4:5) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6DACA"/><stop offset="1" stop-color="#DCCDB6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CDBB9E"/><stop offset="1" stop-color="#E3D6C2"/>
    </linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF2E2"/><stop offset="1" stop-color="#EBDABF"/>
    </linearGradient>
    <radialGradient id="scallop" cx="0.5" cy="0" r="1" fx="0.5" fy="0">
      <stop offset="0" stop-color="#FFF4DE" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#F7E6C6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F7E6C6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9C2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFE9C2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#wall)"/>
  <!-- luz natural entrando pela lateral -->
  <polygon points="40,260 250,190 250,560 40,700" fill="#FFF3DD" opacity="0.55" filter="url(#soft)"/>
  <!-- scallops de wall washer -->
  <ellipse cx="150" cy="40" rx="120" ry="430" fill="url(#scallop)"/>
  <ellipse cx="380" cy="40" rx="120" ry="430" fill="url(#scallop)"/>
  <!-- vão em arco para a sala iluminada -->
  <path d="M520 830 V330 a120 120 0 0 1 240 0 V830 Z" fill="#C9B596"/>
  <path d="M540 830 V340 a100 100 0 0 1 200 0 V830 Z" fill="url(#room)"/>
  <rect x="540" y="700" width="200" height="130" fill="#E4D2B4"/>
  <ellipse cx="640" cy="420" rx="90" ry="140" fill="#FFF8EA" opacity="0.7" filter="url(#soft)"/>
  <!-- pendente -->
  <line x1="300" y1="0" x2="300" y2="420" stroke="#6B6259" stroke-width="1.5"/>
  <circle cx="300" cy="470" r="120" fill="url(#glow)" filter="url(#softer)"/>
  <path d="M250 455 a50 32 0 0 1 100 0 Z" fill="#3A332D"/>
  <ellipse cx="300" cy="456" rx="40" ry="5" fill="#FFF2D6"/>
  <!-- piso e console -->
  <rect y="830" width="800" height="170" fill="url(#floor)"/>
  <rect x="120" y="700" width="330" height="18" fill="#B49C79"/>
  <rect x="140" y="718" width="10" height="112" fill="#A38B68"/>
  <rect x="420" y="718" width="10" height="112" fill="#A38B68"/>
  <ellipse cx="300" cy="712" rx="170" ry="18" fill="#FFF0D2" opacity="0.6" filter="url(#softer)"/>
  <rect x="200" y="640" width="46" height="60" rx="20" fill="#CDB89A"/>
  <rect x="268" y="610" width="30" height="90" rx="14" fill="#D9C7AC"/>
  <ellipse cx="300" cy="900" rx="260" ry="40" fill="#F7EBD5" opacity="0.6" filter="url(#soft)"/>
</svg>
